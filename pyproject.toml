[project]
name = "sanic-starter"
version = "0.1.0"
description = "Opinionated Sanic starter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sanic @ git+https://github.com/victorlane/sanic-framework@main",
    "sanic-ext>=25.12.0",
    "pydantic>=2.14.3",
    "mayim[postgres]>=1.4.2",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.50",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
# Redis-backed sessions, install with:  uv sync --extra redis
redis = ["redis>=8.1.0"]
# Prometheus /metrics endpoint, install with:  uv sync --extra metrics
metrics = [
    "sanic-prometheus @ git+https://github.com/victorlane/sanic-prometheus@master",
]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"

[tool.alembic]
# Migrations live in ./migrations; the database URL comes from POSTGRES_DSN
# (see migrations/env.py), so there is no alembic.ini.
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s"

# Format each generated migration so it passes `ruff check`.
[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "PERF",  # perflint
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.rules]
# mayim executor methods are intentionally bodiless (`...`); mayim's
# hydrator fills them in at runtime from the `@query` SQL.
invalid-implicit-return-in-function-with-stub-body = "ignore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "sanic-testing>=24.6.0",
    "ty>=0.0.104",
]

[tool.hatch.metadata]
# Required to depend on the fork via a direct git URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
